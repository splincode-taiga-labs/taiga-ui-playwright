name: Bootstrap npm lockfile

on:
  pull_request:

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate a deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify package lock and output for repository update
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          echo 'LOCKFILE_START'
          base64 -w0 package-lock.json
          echo
          echo 'LOCKFILE_END'
