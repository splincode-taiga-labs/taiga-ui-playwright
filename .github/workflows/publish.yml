name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish release to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - name: Validate the release tag and commit
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "Expected a SemVer tag like v1.0.1, got: $RELEASE_TAG" >&2
            exit 1
          }
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global npm@^11.15.0
      - run: npm ci --no-audit --no-fund
      - name: Use release tag as package version
        shell: bash
        run: |
          npm version "${RELEASE_TAG#v}" --no-git-tag-version --ignore-scripts --allow-same-version
          if [[ "$RELEASE_TAG" == *-* ]]; then
            echo 'DIST_TAG=next' >> "$GITHUB_ENV"
          else
            echo 'DIST_TAG=latest' >> "$GITHUB_ENV"
          fi
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:pack
      - name: Publish with npm Trusted Publishing (OIDC)
        run: npm publish --access public --tag "$DIST_TAG" --provenance
