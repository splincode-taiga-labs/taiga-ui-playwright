name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Ensure dependency install does not change the lockfile
        run: git diff --exit-code -- package.json package-lock.json
      - run: npm run typecheck
      - run: npm run build
      - name: Verify npm tarball in an independent ESM TypeScript consumer
        run: npm run test:consumer
      - run: npm run build:fixture
      - run: npm run build:docs:pages
      - run: npx playwright install --with-deps chromium
      - name: Smoke test Angular fixture bootstrap
        run: npx playwright test integration/bootstrap.spec.ts --project=integration --reporter=list
      - run: npm test
      - run: npm run test:docs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  cross-browser-smoke:
    name: Cross-browser and mobile smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Repeat real Angular smoke scenarios in each browser
        run: npm run test:smoke -- --repeat-each=2
      - name: Upload failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cross-browser-smoke-results
          path: test-results/
          retention-days: 7
