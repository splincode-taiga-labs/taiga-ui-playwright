name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Ensure dependency install does not change the lockfile
        run: git diff --exit-code -- package.json package-lock.json
      - run: npm run typecheck
      - run: npm run build
      - name: Verify npm tarball in an independent ESM TypeScript consumer
        run: npm run test:consumer
      - run: npm run build:fixture
      - run: npm run build:docs:pages
      - name: Assert npm tarball excludes Angular fixture and docs
        run: npm run test:pack
      - run: npx playwright install --with-deps chromium
      - name: Smoke test Angular fixture bootstrap
        run: npx playwright test integration/bootstrap.spec.ts --project=integration --reporter=list
      - run: npm test
      - run: npm run test:docs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  cross-browser-smoke:
    name: Cross-browser and mobile smoke
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Repeat real Angular smoke scenarios in each browser
        run: npm run test:smoke -- --repeat-each=2
      - name: Stress WebKit async ComboBox without retries
        run: npm run test:smoke -- --project=webkit --grep "asynchronously loaded options" --retries=0 --repeat-each=5
      - name: Upload failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cross-browser-smoke-results
          path: test-results/
          retention-days: 7

  angular-consumer:
    name: Packed Angular consumer (Playwright ${{ matrix.playwright }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        playwright: ['1.51.0', '1.64.1']
    container:
      image: mcr.microsoft.com/playwright:v${{ matrix.playwright }}-noble
      options: --user 1001
    timeout-minutes: 30
    env:
      CONSUMER_PLAYWRIGHT_VERSION: ${{ matrix.playwright }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Install tarball into clean Angular app and exercise real Taiga UI
        run: npm run test:consumer:angular

  consumer-minimum:
    name: Consumer baseline (Node 20 / Playwright 1.51)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Validate minimum declared Playwright peer in a fresh ESM consumer
        run: npm run test:consumer
        env:
          CONSUMER_PLAYWRIGHT_VERSION: 1.51.0
