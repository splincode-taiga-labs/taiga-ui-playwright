name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      npm_version:
        description: 'Exact published version to test from npm (including a 1.0.0 prerelease)'
        required: true
        type: string
        default: '0.1.2'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Ensure dependency install does not change the lockfile
        run: git diff --exit-code -- package.json package-lock.json
      - run: npm run typecheck
      - run: npm run build
      - name: Verify public API export inventory
        run: npm run test:api
      - name: Assert packaged APF entrypoints and package contents
        run: npm run test:pack
      - run: npm run build:fixture
      - run: npm run build:docs:pages
      - name: Verify GitHub Pages /v4/ compatibility URL
        shell: bash
        run: |
          test -f dist/docs/browser/v4/index.html
          grep -Fq '../#/v4' dist/docs/browser/v4/index.html
      - name: Exercise npm prepublish for stable and prerelease versions
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          dist_tag=latest
          if [[ "$version" == *-* ]]; then
            dist_tag=next
          fi
          # npm refuses --dry-run for versions already published to the registry.
          # The packlist has already been verified in the step above.
          published="$(npm view "@taiga-ui-labs/playwright@$version" version --registry=https://registry.npmjs.org/ 2>/dev/null || true)"
          if [[ "$published" == "$version" ]]; then
            echo "Version $version is already published; skipping immutable npm publish --dry-run."
          else
            npm publish ./dist/package --dry-run --ignore-scripts --access public --tag "$dist_tag"
          fi
      - run: npx playwright install --with-deps chromium
      - name: Smoke test Angular fixture bootstrap
        run: npx playwright test integration/bootstrap.spec.ts --project=integration --reporter=list
      - run: npm test
      - run: npm run test:docs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  cross-browser-smoke:
    name: Cross-browser and mobile smoke
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Repeat real Angular smoke scenarios in each browser
        run: npm run test:smoke -- --repeat-each=2
      - name: Stress WebKit async ComboBox without retries
        run: npm run test:smoke -- --project=webkit --grep "asynchronously loaded options" --retries=0 --repeat-each=5
      - name: Upload failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cross-browser-smoke-results
          path: test-results/
          retention-days: 7

  compatibility:
    name: Taiga UI v4 + v5 workspace browsers
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Verify both entrypoints in APF package
        run: npm run test:pack
      - name: Run Playwright against Taiga UI 4 and Taiga UI 5 workspaces
        run: npm run test:compat
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compatibility-results
          path: test-results/
          retention-days: 7
